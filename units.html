<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Absolute units-->
    <h1 class="unit-mm">Font Size</h1>
    <h1 class="unit-cm">Font Size</h1>
    <h1 class="unit-inch">Font Size</h1>
    <h1 class="unit-quarter">Font Size</h1>
    <h1 class="unit-pixel">Font Size</h1>

    <!--Relative units-->
     <h1 class="unit-em">Font Size</h1>
    <h1 class="unit-rem">Font Size</h1>
    <h1 class="unit-vw">Font Size</h1>
    <h1 class="unit-vh">Font Size</h1>
    <h1 class="unit-percent">Font Size</h1>

</body>
</html>
